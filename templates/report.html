<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>📈 تقرير الأداء الأسبوعي</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<h2>📈 تقرير الأداء الأسبوعي</h2>
<table border="1">
  <thead>
    <tr>
      <th>الفرع</th><th>السكتور</th><th>متوسط السرعة</th><th>السرعة القصوى</th><th>أعلى حمل</th>
    </tr>
  </thead>
  <tbody>
    {% for row in data %}
    <tr>
      <td>{{ row.branch }}</td>
      <td>{{ row.hostname }}</td>
      <td>{{ row.avg_speed }}</td>
      <td>{{ row.peak_speed }}</td>
      <td>{{ row.max_load }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</body>
</html>
