
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>📊 تقرير الأداء الأسبوعي</title>
</head>
<body>
    <h2>📊 الأداء الأسبوعي للسكتورات</h2>
    <table border="1" style="width:100%">
        <thead>
            <tr>
                <th>الفرع</th>
                <th>السكتور</th>
                <th>📶 متوسط السرعة</th>
                <th>🚀 أعلى سرعة</th>
                <th>🔥 أعلى تحميل</th>
            </tr>
        </thead>
        <tbody>
            {% for s in stats %}
            <tr>
                <td>{{ s.branch }}</td>
                <td>{{ s.hostname }}</td>
                <td>{{ s.avg_speed }}</td>
                <td>{{ s.peak_speed }}</td>
                <td>{{ s.max_load }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
